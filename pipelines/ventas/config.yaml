# ============================================================
# PIPELINE DE EJEMPLO: VENTAS MINORISTAS
# ------------------------------------------------------------
# Demuestra que el motor ETL se reutiliza en otro sector SOLO
# con configuración: no hay código Python específico de ventas.
#
# Ejecutar (desde la raíz del proyecto):
#   PowerShell:  $env:ETL_CONFIG_PATH = "pipelines\ventas\config.yaml"
#   Bash:        export ETL_CONFIG_PATH=pipelines/ventas/config.yaml
#   python -m src.migrar
#   python -m src.ejecutar_pipeline
#
# Ver pipelines/ventas/README.md
# ============================================================

proyecto:
  nombre: "ventas_minoristas"
  version: "1.0.0"
  entorno: "desarrollo"


# Dos tiendas que envían un archivo por día (lotes)
fuentes:
  - nombre: "Tienda Norte"
    patron: "tienda_norte_*.csv"

  - nombre: "Tienda Sur"
    patron: "tienda_sur_*.csv"


# Solo se procesan los archivos que no se hayan cargado antes
ingesta:
  modo: "incremental"


esquema:
  columnas:
    - nombre: "pedido_id"
      tipo: "texto"
      etiqueta: "Pedido"
      longitud_max: 12

    - nombre: "fecha"
      tipo: "fecha"
      etiqueta: "Fecha"

    - nombre: "cliente_id"
      tipo: "texto"
      etiqueta: "Cliente"
      longitud_max: 10

    - nombre: "producto"
      tipo: "texto"
      etiqueta: "Producto"
      longitud_max: 100

    - nombre: "categoria"
      tipo: "texto"
      etiqueta: "Categoría"

    - nombre: "cantidad"
      tipo: "entero"
      etiqueta: "Cantidad"

    - nombre: "precio_unitario"
      tipo: "decimal"
      etiqueta: "Precio unitario"

    - nombre: "canal"
      tipo: "texto"
      etiqueta: "Canal"

    - nombre: "tienda_origen"
      tipo: "texto"
      etiqueta: "Tienda"
      derivada: true


reglas:
  - columna: "pedido_id"
    tipo: "patron"
    patron: "PED-\\d{6}"
    mensaje: "Pedido con formato inválido (esperado PED-000000)"

  - columna: "cantidad"
    tipo: "rango"
    min: 1
    max: 1000
    mensaje: "Cantidad fuera del rango permitido (1 a 1000)"

  - columna: "precio_unitario"
    tipo: "rango"
    min: 0
    min_inclusivo: false
    mensaje: "Precio unitario debe ser mayor que 0"

  - columna: "categoria"
    tipo: "valores_permitidos"
    valores: ["Tecnologia", "Hogar", "Libros"]
    mensaje: "Categoría no permitida"

  - columna: "canal"
    tipo: "valores_permitidos"
    valores: ["web", "tienda", "telefono"]
    mensaje: "Canal de venta no permitido"


rutas:
  raw: "data/ventas/raw"
  processed: "data/ventas/processed"
  rejected: "data/ventas/rejected"
  logs: "logs/ventas"


archivos:
  consolidados: "datos_consolidados_sin_limpieza.csv"
  limpios: "datos_limpios.csv"
  validados: "datos_validados.csv"
  incompletos: "registros_incompletos.csv"
  duplicados: "registros_duplicados.csv"
  fuera_reglas: "registros_fuera_reglas.csv"
  conflictos_clave: "registros_conflicto_clave.csv"
  manifiesto: "manifiesto_archivos.json"


pipeline:
  id: "ventas_etl_pipeline"
  columna_fuente: "tienda_origen"

  # Un pedido es único dentro de cada tienda
  clave_negocio:
    - "pedido_id"
    - "tienda_origen"

  tareas:
    - nombre: "consolidar"
      modulo: "src.consolidar_datos"
      funcion: "ejecutar_consolidacion"

    - nombre: "limpiar"
      modulo: "src.limpiar_datos"
      funcion: "ejecutar_limpieza"

    - nombre: "validar"
      modulo: "src.validar_reglas"
      funcion: "ejecutar_validacion"

    - nombre: "cargar_incremental"
      modulo: "src.cargar_incremental"
      funcion: "ejecutar_carga_incremental"

    - nombre: "registrar_ingesta"
      modulo: "src.ingesta"
      funcion: "registrar_ingesta"

  detener_si_falla: true


# Todo el proyecto vive en su propio esquema de PostgreSQL
base_datos:
  esquema: "ventas"
  tabla_destino: "pedidos"
  tabla_auditoria: "etl_auditoria"
  tabla_archivos: "etl_archivos_procesados"
  columna_actualizacion: "fecha_actualizacion"


migraciones:
  directorio: "pipelines/ventas/migraciones"


logging:
  archivo: "pipeline.log"
  nivel: "INFO"
  max_bytes: 5242880
  backup_count: 5
  encoding: "utf-8"
  formato: "%(asctime)s | %(levelname)s | %(run_id)s | %(name)s | %(message)s"
