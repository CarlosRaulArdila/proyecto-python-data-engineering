name: CI

on:
  push:
    branches: [main, "feature/**", "refactor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-y-pruebas:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest (unitarias)
        run: pytest -v --cov=src --cov-report=term-missing

  integracion:
    name: Integración con PostgreSQL
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hospital_dw_test
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d hospital_dw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: hospital_dw_test
      DB_USER: etl
      DB_PASSWORD: etl
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Pytest (integración)
        run: pytest -v -m integracion

  imagen-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build --build-arg ETL_VERSION=ci -t hospital-etl:ci .

      - name: Comprobar que la imagen importa el motor
        run: docker run --rm hospital-etl:ci python -c "import src.ejecutar_pipeline, src.migrar"
